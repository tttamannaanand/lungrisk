name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Runs the independent resplab/PLCOm2012 R package on 500 cases and fails
  # if this implementation disagrees with it on any of them.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fixture is up to date with the generator
        run: npm run conformance:inputs && git diff --exit-code tests/fixtures/
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - run: Rscript scripts/r-reference.R
      - run: npm run conformance:compare
